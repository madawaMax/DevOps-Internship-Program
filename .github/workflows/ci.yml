name: Express API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: 08-Express-API-GitHub-Actions
        run: npm ci

      - name: Run tests
        working-directory: 08-Express-API-GitHub-Actions
        run: npm test

      - name: Build Docker image
        working-directory: 08-Express-API-GitHub-Actions
        run: docker build -t express-api:ci .
